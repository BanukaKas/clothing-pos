<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINT FASHION — Modern Clothing Store POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              display: ['Outfit', 'system-ui', 'sans-serif'],
            },
            colors: {
              ivory: {
                50: '#fafbf9',
                100: '#f5f7f5',
                200: '#ecefec',
                300: '#dde2dd',
              },
              charcoal: {
                800: '#1f2937',
                850: '#18202f',
                900: '#111827',
                950: '#0b111e',
              },
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
            },
            boxShadow: {
              card: '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
              elevation: '0 4px 20px -2px rgba(15, 23, 42, 0.08)',
              thermal: '0 10px 35px -5px rgba(0, 0, 0, 0.15)',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#f8faf8] text-slate-800 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
